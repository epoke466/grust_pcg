name: Build GDExtension Binaries

on:
  push:
    branches: [ main ] # Runs every time you push to the main branch
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output_name: libgodot_pcg.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: godot_pcg.dll
          - os: macos-latest
            target: x86_64-apple-darwin
            output_name: libgodot_pcg.dylib

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # Linux builds require extra dependencies for Godot-Rust compilation
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libclang-dev

    - name: Build Rust Library (Release)
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload Binary Artifact
      uses: actions/abstract/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: target/${{ matrix.target }}/release/${{ matrix.output_name }}
