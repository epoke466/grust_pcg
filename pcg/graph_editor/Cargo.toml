[package]
name = "graph_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = {version = "0.14.0", features = ["canvas"]}

rfd = "0.17.2"

strum = "0.26"
strum_macros = "0.26"

shared = { path = "../shared" }
convert_case = "0.11.0"
uuid = {version = "1.23.1", features = ["v4", "serde"]}
walkdir = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
confy = { version = "2.0.0", default-features = false, features = ["ron_conf"] }
native-theme-iced = "0.5.7"
lucide-icons = { version = "1.24.0", features = ["iced"] }
